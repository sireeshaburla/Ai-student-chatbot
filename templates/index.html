<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student AI Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 520px;
            height: 680px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .status {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9ff;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .user-message {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .bot-message .message-content {
            background: #e8eaff;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .user-message .message-content {
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .suggestions {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            background: white;
            border-top: 1px solid #eee;
        }

        .suggestion {
            white-space: nowrap;
            border: 1px solid #ddd;
            background: #f5f5ff;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .suggestion:hover {
            background: #e5e7ff;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        #messageInput:focus {
            border-color: #4f46e5;
        }

        #sendButton {
            border: none;
            background: #4f46e5;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        #sendButton:hover {
            background: #3730a3;
        }

        #sendButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .typing {
            display: none;
            color: #666;
            font-size: 12px;
            padding: 5px 20px 10px;
            background: #f8f9ff;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                max-width: 100%;
                border-radius: 0;
            }

            .header h1 {
                font-size: 21px;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h1>🎓 Student AI Chatbot</h1>

            <p>
                Ask about admissions, courses, careers, programming & more
            </p>

            <div class="status">
                🟢 Online
            </div>
        </div>


        <div class="chat-box" id="chatBox">

            <div class="message bot-message">

                <div class="message-content">
                    Hello! 👋 I am the Student AI Chatbot.

                    Ask me about admissions, courses, fees, internships,
                    placements, programming, AI/ML, careers and more.
                </div>

            </div>

        </div>


        <div class="typing" id="typing">
            🤖 Bot is typing...
        </div>


        <div class="suggestions">

            <button
                class="suggestion"
                onclick="sendSuggestion('What courses are available?')">
                Courses
            </button>

            <button
                class="suggestion"
                onclick="sendSuggestion('What are the fees?')">
                Fees
            </button>

            <button
                class="suggestion"
                onclick="sendSuggestion('How can I apply for admission?')">
                Admission
            </button>

            <button
                class="suggestion"
                onclick="sendSuggestion('How can I prepare for placements?')">
                Placements
            </button>

            <button
                class="suggestion"
                onclick="sendSuggestion('How can I learn Python?')">
                Python
            </button>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>


    <script>

        const input = document.getElementById("messageInput");
        const chatBox = document.getElementById("chatBox");
        const sendButton = document.getElementById("sendButton");
        const typing = document.getElementById("typing");


        function addMessage(message, sender) {

            const messageDiv = document.createElement("div");

            messageDiv.classList.add("message");

            if (sender === "user") {
                messageDiv.classList.add("user-message");
            } else {
                messageDiv.classList.add("bot-message");
            }


            const content = document.createElement("div");

            content.classList.add("message-content");

            content.textContent = message;


            messageDiv.appendChild(content);

            chatBox.appendChild(messageDiv);


            chatBox.scrollTop = chatBox.scrollHeight;
        }


        async function sendMessage() {

            const message = input.value.trim();


            if (message === "") {
                return;
            }


            addMessage(message, "user");

            input.value = "";

            sendButton.disabled = true;

            typing.style.display = "block";


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    addMessage(
                        data.response || "Something went wrong.",
                        "bot"
                    );

                    return;
                }


                addMessage(data.response, "bot");


            } catch (error) {

                console.error(error);

                addMessage(
                    "Sorry, I couldn't connect to the chatbot server. Please try again.",
                    "bot"
                );

            } finally {

                typing.style.display = "none";

                sendButton.disabled = false;

                input.focus();
            }
        }


        function sendSuggestion(message) {

            input.value = message;

            sendMessage();
        }


        input.addEventListener("keypress", function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();
            }

        });


        input.focus();

    </script>

</body>

</html>
